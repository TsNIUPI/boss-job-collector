<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOSS采集工作台</title><link rel="icon" href="icons/boss32.png"><link rel="stylesheet" href="dashboard.css"></head><body>
<header><div><span class="tag"><img src="icons/boss48.png" width="28" height="28" alt="BOSS"> BOSS 采集助手</span><h1>岗位企业采集</h1><p>选关键词和城市 → 开始采集 → 导出 Excel</p></div><span id="status" class="status">未创建任务</span></header>
<main><section class="settings card"><h2>采集设置</h2><label>岗位关键词<input id="keyword" value="tiktok剪辑" maxlength="80" placeholder="例如：视频剪辑、跨境电商运营"></label><div class="row"><h3>采集城市</h3><button id="all" class="link">全选</button><button id="none" class="link">全取消</button></div><div id="cities" class="cities"></div><details><summary>高级设置</summary><label>采集间隔（秒）<input id="interval" type="number" value="120" min="60" max="300"></label><label>连续滚动无新增的检查次数<input id="stall" type="number" value="4" min="3" max="10"></label></details><button id="new" class="primary full">保存设置</button><p id="action-error" role="alert" class="error"></p></section>
<section class="work"><div class="toolbar card"><div><h2 id="task-title">准备开始</h2><p id="step">保存设置后点击开始。</p></div><div class="actions"><button id="resume" class="primary">开始 / 继续</button><button id="pause">暂停</button><button id="retry">重查未完成</button><button id="history">历史任务</button></div></div><div id="history-list" class="card" hidden></div>
<div class="metrics"><div class="card"><span>已保存岗位</span><strong id="saved">0</strong></div><div class="card"><span>去重公司</span><strong id="companies">0</strong></div><div class="card"><span>已发现岗位</span><strong id="found">0</strong></div><div class="card"><span>待核查</span><strong id="review">0</strong></div></div>
<div class="card progress"><div class="row"><h2 id="city">当前地区：—</h2><span id="updated"></span></div><progress id="progress" max="100" value="0"></progress><p id="local">总数：加载中</p><p id="reason" class="notice"></p><div id="city-status" class="city-status"></div></div>
<div class="card"><div class="row"><h2>采集结果</h2><select id="result-city" aria-label="查看地区"><option value="">全部地区</option></select><div class="actions"><button id="xlsx">导出 Excel</button><button id="csv">导出 CSV</button><button id="backup">备份任务 JSON</button><button id="restore">导入备份</button><input id="restore-file" type="file" accept=".json" hidden></div></div><div class="table-scroll"><table><thead><tr><th>岗位名称</th><th>公司全称</th><th>法人</th><th>注册资金</th><th>成立日期</th><th>信用代码</th><th>地区</th></tr></thead><tbody id="results"></tbody></table></div><p class="sub">显示最近50条，导出全部结果。</p></div>
<details class="card"><summary>运行记录与待核查</summary><div id="logs" class="logs"></div></details></section></main>
<footer>工作台可关闭，保持Chrome及采集页开启、电脑不休眠；每轮最多20次公司详情访问或30分钟，达到上限休息1小时后手动继续；这些是程序上限，不是平台安全额度。</footer>
<script src="vendor/jszip.min.js"></script><script type="module" src="dashboard.js"></script></body></html>
